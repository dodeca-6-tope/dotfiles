"$schema" = 'https://starship.rs/config-schema.json'

# Directory and Git on the first line, prompt character on the second.
format = '$directory$git_branch$git_commit$git_state$git_status$line_break$character'
right_format = '$cmd_duration$jobs$username$hostname'

[directory]
style = 'bold blue'
truncation_length = 1
truncate_to_repo = false
read_only = ' ro'

[git_branch]
only_attached = true
style = 'green'
truncation_length = 32
truncation_symbol = '..'

[git_commit]
style = 'green'
commit_hash_length = 8
tag_disabled = false
format = '[@$hash$tag]($style) '

[git_state]
style = 'bold red'
format = '[$state( $progress_current/$progress_total)]($style) '

[git_status]
style = 'yellow'
format = '([$ahead_behind$all_status]($style))'
ahead = '>${count} '
behind = '<${count} '
diverged = '<${behind_count}>${ahead_count} '
conflicted = '~${count} '
staged = '+${count} '
modified = '!${count} '
untracked = '?${count} '
deleted = '-${count} '
renamed = 'r${count} '
stashed = ''

[character]
success_symbol = '[>](green)'
error_symbol = '[>](red)'
vimcmd_symbol = '[<](green)'
vimcmd_replace_one_symbol = '[^](green)'
vimcmd_replace_symbol = '[^](green)'
vimcmd_visual_symbol = '[V](green)'

[cmd_duration]
min_time = 3000
format = '[$duration]($style) '

[jobs]
symbol = 'jobs '

[username]
format = '[$user]($style)'

[hostname]
format = '[@$hostname]($style) '
